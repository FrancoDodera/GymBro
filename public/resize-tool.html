<!DOCTYPE html>
<html>

<body>
    <img id="source" src="/icons/icon-512x512.png" onload="process()" crossorigin="anonymous">
    <div id="output-192"></div>
    <div id="output-512"></div>
    <script>
        function process() {
            const img = document.getElementById('source');

            // Resize to 192
            const c192 = document.createElement('canvas');
            c192.width = 192;
            c192.height = 192;
            const ctx192 = c192.getContext('2d');
            ctx192.drawImage(img, 0, 0, 192, 192);
            document.getElementById('output-192').textContent = c192.toDataURL('image/png');

            // Resize to 512 (ensure exact 512 even if source is 1024)
            const c512 = document.createElement('canvas');
            c512.width = 512;
            c512.height = 512;
            const ctx512 = c512.getContext('2d');
            ctx512.drawImage(img, 0, 0, 512, 512);
            document.getElementById('output-512').textContent = c512.toDataURL('image/png');
        }
    </script>
</body>

</html>
